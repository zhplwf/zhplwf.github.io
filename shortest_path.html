<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>最短路径探索游戏</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "Microsoft YaHei", sans-serif;
        }
        body {
            background-color: #f0f2f5;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px 0;
        }
        .container {
            background: #ffffff;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 2px 12px rgba(0,0,0,0.08);
            max-width: 650px;
            width: 90%;
            text-align: center;
        }
        h1 {
            color: #2b3a55;
            margin-bottom: 15px;
            font-size: 28px;
        }
        .desc {
            color: #444;
            margin-bottom: 10px;
            font-size: 16px;
        }
        .time-info {
            font-size: 22px;
            font-weight: bold;
            margin: 20px 0;
            color: #2b3a55;
        }
        .graph-container {
            position: relative;
            width: 420px;
            height: 360px;
            margin: 20px auto;
            border: 1px solid #e0e0e0;
            border-radius: 4px;
            background-color: #fff;
        }
        .node {
            position: absolute;
            width: 45px;
            height: 45px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 18px;
            cursor: pointer;
            border: 2px solid #4a90e2;
            background-color: #ffffff;
            color: #2b3a55;
            transition: all 0.2s ease;
        }
        .node.orange {
            background-color: #ff9933;
            border-color: #ff9933;
            color: white;
        }
        .node.red {
            background-color: #e74c3c;
            border-color: #e74c3c;
            color: white;
        }
        .edge {
            position: absolute;
            background: #ccc;
            z-index: 0;
        }
        .edge.active {
            background: red !important;
        }
        .edge-text {
            position: absolute;
            background: white;
            padding: 2px 6px;
            border-radius: 3px;
            font-size: 13px;
            color: #444;
            border: 1px solid #ddd;
            z-index: 1;
        }
        .btn-group {
            margin: 25px 0;
            display: flex;
            justify-content: center;
            gap: 15px;
            flex-wrap: wrap;
        }
        button {
            padding: 10px 22px;
            border: none;
            border-radius: 4px;
            background-color: #3498db;
            color: white;
            font-size: 16px;
            cursor: pointer;
            transition: background 0.2s;
        }
        button:hover {
            background-color: #2980b9;
        }
        .result {
            margin-top: 20px;
            padding: 12px;
            background-color: #f0f4f8;
            border-radius: 6px;
            color: #34495e;
            font-size: 16px;
            min-height: 40px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>最短路径探索游戏</h1>
        <p class="desc">请选择从起点(A)到终点(I)的路径，只能向右或向下移动，找出用时最短的路线！</p>
        <div class="time-info">当前路径用时: <span id="currentTime">0</span> 分钟</div>
        
        <div class="graph-container" id="graph">
            <div class="node orange" id="A" style="top: 40px; left: 60px;">A</div>
            <div class="node" id="B" style="top: 40px; left: 190px;">B</div>
            <div class="node" id="C" style="top: 40px; left: 320px;">C</div>
            
            <div class="node" id="D" style="top: 150px; left: 60px;">D</div>
            <div class="node" id="E" style="top: 150px; left: 190px;">E</div>
            <div class="node" id="F" style="top: 150px; left: 320px;">F</div>
            
            <div class="node" id="G" style="top: 260px; left: 60px;">G</div>
            <div class="node" id="H" style="top: 260px; left: 190px;">H</div>
            <div class="node red" id="I" style="top: 260px; left: 320px;">I</div>
            
            <!-- 横向边 -->
            <div class="edge" id="A-B" style="top: 60px; left: 105px; width: 80px; height: 2px;"></div>
            <div class="edge-text" style="top: 50px; left: 140px;">3</div>
            <div class="edge" id="B-C" style="top: 60px; left: 235px; width: 80px; height: 2px;"></div>
            <div class="edge-text" style="top: 50px; left: 270px;">2</div>
            
            <div class="edge" id="D-E" style="top: 170px; left: 105px; width: 80px; height: 2px;"></div>
            <div class="edge-text" style="top: 160px; left: 140px;">3</div>
            <div class="edge" id="E-F" style="top: 170px; left: 235px; width: 80px; height: 2px;"></div>
            <div class="edge-text" style="top: 160px; left: 270px;">2</div>
            
            <div class="edge" id="G-H" style="top: 280px; left: 105px; width: 80px; height: 2px;"></div>
            <div class="edge-text" style="top: 270px; left: 140px;">3</div>
            <div class="edge" id="H-I" style="top: 280px; left: 235px; width: 80px; height: 2px;"></div>
            <div class="edge-text" style="top: 270px; left: 270px;">3</div>
            
            <!-- 纵向边 -->
            <div class="edge" id="A-D" style="top: 95px; left: 80px; width: 2px; height: 60px;"></div>
            <div class="edge-text" style="top: 120px; left: 65px;">2</div>
            <div class="edge" id="B-E" style="top: 95px; left: 210px; width: 2px; height: 60px;"></div>
            <div class="edge-text" style="top: 120px; left: 195px;">1</div>
            <div class="edge" id="C-F" style="top: 95px; left: 340px; width: 2px; height: 60px;"></div>
            <div class="edge-text" style="top: 120px; left: 325px;">2</div>
            
            <div class="edge" id="D-G" style="top: 205px; left: 80px; width: 2px; height: 60px;"></div>
            <div class="edge-text" style="top: 230px; left: 65px;">3</div>
            <div class="edge" id="E-H" style="top: 205px; left: 210px; width: 2px; height: 60px;"></div>
            <div class="edge-text" style="top: 230px; left: 195px;">1</div>
            <div class="edge" id="F-I" style="top: 205px; left: 340px; width: 2px; height: 60px;"></div>
            <div class="edge-text" style="top: 230px; left: 325px;">1</div>
        </div>
        
        <div class="btn-group">
            <button id="checkBtn">检查路径</button>
            <button id="resetBtn">重新开始</button>
            <button id="hintBtn">提示</button>
            <button id="answerBtn">显示答案</button>
        </div>
        
        <div class="result" id="resultText"></div>
    </div>

    <script>
        const edges = {
            'A': ['B', 'D'],
            'B': ['C', 'E'],
            'C': ['F'],
            'D': ['E', 'G'],
            'E': ['F', 'H'],
            'F': ['I'],
            'G': ['H'],
            'H': ['I'],
            'I': []
        };
        
        const weights = {
            'A-B':3,'B-C':2,
            'D-E':3,'E-F':2,
            'G-H':3,'H-I':3,
            'A-D':2,'B-E':1,'C-F':2,
            'D-G':3,'E-H':1,'F-I':1
        };
        
        // 正确最短时间
        const minTime = 7;
        let currentPath = ['A'];
        let currentTotalTime = 0;
        
        const nodes = document.querySelectorAll('.node');
        const edgesElements = document.querySelectorAll('.edge');
        const currentTimeEl = document.getElementById('currentTime');
        const resultText = document.getElementById('resultText');
        
        nodes.forEach(node => {
            node.addEventListener('click', () => handleNodeClick(node.id));
        });
        
        function handleNodeClick(nodeId) {
            if (currentPath.includes(nodeId)) return;
            const lastNode = currentPath[currentPath.length - 1];
            if (!edges[lastNode].includes(nodeId)) {
                resultText.textContent = "只能向右或向下移动哦！";
                resultText.style.color = "#e74c3c";
                return;
            }
            
            const edgeId = `${lastNode}-${nodeId}`;
            currentPath.push(nodeId);
            currentTotalTime += weights[edgeId];
            
            currentTimeEl.textContent = currentTotalTime;
            document.getElementById(edgeId).classList.add('active');
            document.getElementById(nodeId).classList.add('orange');
            resultText.textContent = "";
        }
        
        document.getElementById('checkBtn').addEventListener('click', () => {
            if (currentPath.at(-1) !== 'I') {
                resultText.textContent = "还没到达终点I哦！";
                resultText.style.color = "#e74c3c";
                return;
            }
            if (currentTotalTime === minTime) {
                resultText.textContent = `太棒了！你找到了最短路径，总用时 ${currentTotalTime} 分钟！`;
                resultText.style.color = "#27ae60";
            } else {
                resultText.textContent = `路径正确但不是最短，最短用时为 ${minTime} 分钟。`;
                resultText.style.color = "#2980b9";
            }
        });
        
        document.getElementById('resetBtn').addEventListener('click', () => {
            currentPath = ['A'];
            currentTotalTime = 0;
            currentTimeEl.textContent = 0;
            resultText.textContent = "";
            
            edgesElements.forEach(e => e.classList.remove('active'));
            nodes.forEach(node => {
                if (node.id === 'A') node.classList.add('orange');
                else if (node.id === 'I') node.classList.add('red');
                else node.classList.remove('orange', 'red');
            });
        });
        
        document.getElementById('hintBtn').addEventListener('click', () => {
            resultText.textContent = "提示：最短路径总用时为 7 分钟，可多尝试中间路线。";
            resultText.style.color = "#8e44ad";
        });
        
        document.getElementById('answerBtn').addEventListener('click', () => {
            document.getElementById('resetBtn').click();
            // 正确最短路径
            const path = ['A','B','E','F','I'];
            let t = 0;
            for (let i=0; i<path.length-1; i++) {
                const u = path[i], v = path[i+1];
                const eid = `${u}-${v}`;
                document.getElementById(eid).classList.add('active');
                document.getElementById(v).classList.add('orange');
                t += weights[eid];
            }
            currentPath = path;
            currentTotalTime = t;
            currentTimeEl.textContent = t;
            resultText.textContent = `最短路径：${path.join(' → ')}，用时 ${t} 分钟`;
            resultText.style.color = "#27ae60";
        });
    </script>
</body>
</html>
